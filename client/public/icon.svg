<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.8" />

  <!-- Ambient Glow Behind Crown -->
  <circle cx="256" cy="256" r="160" fill="#f59e0b" opacity="0.15" filter="url(#glow)" />

  <!-- Chess King Emblem -->
  <g transform="translate(106, 80) scale(4.7)">
    <!-- King Cross Top -->
    <path d="M32 6V14M28 10H36" stroke="url(#goldLight)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="32" cy="10" r="1.5" fill="#FFFBEB" />

    <!-- Crown Finials & Arches (Left Specular Side) -->
    <path d="M32 14C28 14 23 18 21 24C24 24 27 23 29 20C30 22 31 23 32 23V14Z" fill="url(#goldLight)" />
    <!-- Crown Finials & Arches (Right Shadow Side) -->
    <path d="M32 14C36 14 41 18 43 24C40 24 37 23 35 20C34 22 33 23 32 23V14Z" fill="url(#goldShadow)" />

    <!-- Crown Center Gem Facet -->
    <polygon points="32,16 35,21 32,25 29,21" fill="#FFFBEB" opacity="0.9" />

    <!-- Main Upper Body / Crest (Left) -->
    <path d="M32 24C25 24 20 28 18 36H32V24Z" fill="url(#goldLight)" />
    <!-- Main Upper Body / Crest (Right) -->
    <path d="M32 24C39 24 44 28 46 36H32V24Z" fill="url(#goldShadow)" />

    <!-- Diamond Center Core -->
    <polygon points="32,25 38,33 32,41 26,33" fill="#FEF3C7" />
    <polygon points="32,25 38,33 32,41" fill="#F59E0B" opacity="0.6" />

    <!-- Lower Waist Ring -->
    <path d="M19 38H45L46 43H18L19 38Z" fill="url(#goldShadow)" />
    <path d="M19 38H32L32 43H18L19 38Z" fill="url(#goldLight)" />

    <!-- Base Pedestal (Layer 1) -->
    <path d="M17 44H47L48 50H16L17 44Z" fill="url(#goldShadow)" />
    <path d="M17 44H32L32 50H16L17 44Z" fill="url(#goldLight)" />

    <!-- Base Pedestal Bottom Plinth (Layer 2) -->
    <rect x="13" y="51" width="38" height="5" rx="2" fill="url(#goldShadow)" />
    <rect x="13" y="51" width="19" height="5" rx="2" fill="url(#goldLight)" />
  </g>
</svg>
