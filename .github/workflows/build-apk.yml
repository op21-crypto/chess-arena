name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Chess Arena APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/ChessWithFriends-v1.0.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/ChessArena-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessWithFriends-Android-APK
          path: release-output/ChessWithFriends-v1.0.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "Chess with Friends Android App v1.0.0"
          body: |
            ## ♟️ Chess with Friends Android APK (Latest)
            
            Welcome to the official Android build of **Chess with Friends**!
            
            ### ✨ Features Included in this Build:
            - **Mobile-Optimized Chessboard**: Tap-to-move, drag-and-drop, King check indicators, and authentic piece sound effects.
            - **Tactics Trainer & Puzzles**: Interactive puzzles, puzzle streak, puzzle storm, and on-board captured piece display.
            - **Live Multiplayer**: Play with friends, shareable game links, and instant matchmaking.
            - **Real-Time WebRTC Voice Chat**: Live voice communication with mutual consent in friends rooms.
            - **Stockfish AI Analysis**: Engine evaluation, game review, accuracy ratings, and blunder detection.
            - **Offline Pass-and-Play**: Full local 2-player board accessible without internet.
            
            ### 📥 Download & Installation:
            1. Download the attached **ChessWithFriends-v1.0.0.apk** below.
            2. Open the downloaded file on your Android device.
            3. If prompted, allow "Install from unknown sources" and tap **Install**.
          files: |
            release-output/ChessWithFriends-v1.0.0.apk
            release-output/ChessArena-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
