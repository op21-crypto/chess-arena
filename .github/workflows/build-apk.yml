name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Chess Arena APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/CHESS.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/ChessArena.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/ChessArena-v1.0.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/ChessWithFriends-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHESS-Android-APK
          path: release-output/CHESS.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "CHESS Official Android App Release"
          body: |
            ## ♟️ CHESS - Official Android App Release (Latest)
            
            Welcome to the official Android build of **CHESS**!
            
            ### ✨ Features in this Build:
            - **New Ultra-Lucid 3D Clash App Icon & CHESS launcher name**
            - **Bright & Lucid Login / Sign In with Day & Night modes**
            - **Mobile-Optimized Chessboard**: Tap-to-move, drag-and-drop, King check indicators, authentic audio.
            - **Tactics Trainer & Puzzles**: Interactive puzzles, puzzle streak, puzzle storm, 60+ motifs & openings.
            - **Live Multiplayer**: Play with friends, shareable room links, real-time matchmaking.
            - **WebRTC Voice Chat & In-Game Chat**: Live voice communication with mutual consent in friends rooms.
            - **Stockfish AI Analysis**: Engine evaluation, game review, accuracy ratings, blunder detection.
            - **Universal Greenwich Tournament Board**: High-contrast slate ice & slate steel board theme across all modes.
            
            ### 📥 Download & Installation:
            1. Download **CHESS.apk** (or **ChessArena.apk**) below.
            2. Open the downloaded file on your Android device.
            3. If prompted, allow "Install from unknown sources" and tap **Install**.
          files: |
            release-output/CHESS.apk
            release-output/ChessArena.apk
            release-output/ChessArena-v1.0.0.apk
            release-output/ChessWithFriends-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
